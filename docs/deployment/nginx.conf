# Example only. Adapt domain, paths, TLS and PHP-FPM socket to your host.
server {
    listen 443 ssl;
    server_name example.com;
    root /srv/ard-alyarmwk/public;
    index index.php;
    # ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    client_max_body_size 42m;
    add_header X-Content-Type-Options nosniff always;
    location ~ /\. { deny all; }
    location ^~ /uploads/ { deny all; }
    # Prepared films are streamed through /media/:id with publication checks and HTTP Range.
    location ^~ /assets/video/ { return 404; }
    location ^~ /assets/profile/ { return 404; }
    location ~* ^/assets/.*\.(?:css|js|mjs|webp|png|jpg|jpeg|woff2|ttf|bcmap|pfb|wasm)$ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        types { text/css css; text/javascript js mjs; image/webp webp; image/png png; image/jpeg jpg jpeg; font/woff2 woff2; font/ttf ttf; application/wasm wasm; }
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { deny all; }
}
